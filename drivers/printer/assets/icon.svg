<svg xmlns="http://www.w3.org/2000/svg" viewBox="104 92 816 816" width="816" height="816">
  <g fill="none" stroke="#000000" stroke-width="34" stroke-linejoin="round" stroke-linecap="round">
    <!--
      Paper feeder. Already open at the bottom, because the body is in front of it.
    -->
    <path d="M305 350V185Q305 155 335 155H689Q719 155 719 185V350"/>

    <!--
      Printer body, open along the bottom where the page passes in front of it.
      The gap runs from x=271 to x=753: those are the page's sloped edges where
      they cross y=690. Drawing the full rectangle here is what made the body's
      line show through the page.
    -->
    <path d="M753 690H860Q900 690 900 650V386Q900 350 864 350H160Q124 350 124 386V650Q124 690 164 690H271"/>

    <!--
      Output slot, open along the bottom for the same reason. Its sides stay
      visible: at x=234 and x=790 they fall outside the page, which is only
      283 to 741 wide where it crosses y=600.
    -->
    <path d="M741 600H774Q790 600 790 585V516Q790 500 774 500H250Q234 500 234 516V585Q234 600 250 600H283"/>

    <!-- The printed page, in front of everything, so it is drawn whole. -->
    <path d="M290 550L734 550L770 820Q773 845 748 845H276Q251 845 254 820Z"/>

    <!-- Lines of text on the page. -->
    <path stroke-width="22" d="M352 655H672M352 707H678M352 759H547"/>
  </g>

  <!-- Status light -->
  <circle cx="245" cy="430" r="26" fill="#000000"/>
</svg>
