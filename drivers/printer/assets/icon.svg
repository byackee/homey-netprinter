<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
  <!--
    The driver icon, drawn from a right-side three-quarter angle as the App
    Store guidelines ask for, so it reads as a physical device rather than a
    symbol. It must not be the app icon: that one is the app's mark, this one is
    the thing the user adds to Homey. Line work only, transparent background,
    the full 960 canvas.
  -->
  <g fill="none" stroke="#000000" stroke-width="38" stroke-linejoin="round" stroke-linecap="round">
    <!--
      The sheet in the output slot. Open along the bottom: its edges stop at the
      slot rather than closing across it, so the paper reads as coming out of
      the printer instead of lying on top of it.
    -->
    <path d="M320 380 275 175H599L644 380"/>
    <path d="M345 262H535"/>

    <!-- The slot itself, on the top face, one line the sheet rises out of. -->
    <path d="M290 380H674"/>

    <!--
      Body: the front face, then the right face and the top, which together read
      as a box seen from its right-hand side.
    -->
    <path d="M200 430H620V720H200Z"/>
    <path d="M620 430 780 320V610L620 720"/>
    <path d="M200 430 360 320H780"/>

    <!-- Control panel on the front, and the paper drawer below it. -->
    <path d="M480 480H580"/>
    <path d="M240 630H540"/>
  </g>
</svg>
