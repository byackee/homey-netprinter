<style>
  .intro { color: var(--homey-text-color-light); margin-bottom: 1rem; line-height: 1.45; }
  .row {
    display: flex; align-items: center; gap: .75rem;
    width: 100%; box-sizing: border-box; text-align: left;
    padding: .75rem .85rem; margin-bottom: .5rem;
    border: 1px solid var(--homey-line-color); border-radius: 8px;
    background: var(--homey-background-color); color: var(--homey-text-color);
    font: inherit; cursor: pointer;
  }
  .row:hover { border-color: var(--homey-color-blue, #1B6AC9); }
  .row:disabled { opacity: .55; cursor: default; }
  .row .name { font-weight: 600; }
  .row .meta { color: var(--homey-text-color-light); font-size: .85rem; }
  .row .grow { flex: 1; min-width: 0; }
  .row .name, .row .meta { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status { margin: 1rem 0; color: var(--homey-text-color-light); line-height: 1.45; }
  .status.bad { color: var(--homey-color-red, #da3633); }
  .manual { margin-top: 1.5rem; border-top: 1px solid var(--homey-line-color); padding-top: 1rem; }
  .manual summary { cursor: pointer; color: var(--homey-text-color-light); }
  .manual .fields { display: flex; gap: .5rem; margin-top: .75rem; }
  .manual input {
    flex: 1; min-width: 0; padding: .55rem .65rem; font-size: 1rem;
    border: 1px solid var(--homey-line-color); border-radius: 6px;
    background: var(--homey-background-color); color: var(--homey-text-color);
  }
  button {
    padding: .55rem 1rem; border-radius: 6px; border: 0; cursor: pointer;
    background: var(--homey-color-blue, #1B6AC9); color: #fff; font: inherit;
  }
  button:disabled { opacity: .55; cursor: default; }
  #search { width: 100%; padding: .7rem 1rem; font-weight: 600; }
  .hidden { display: none; }

  /* Progress while the sweep runs. The sweep takes around sixteen seconds, which
     is long enough that a still screen reads as broken. */
  .spinner {
    display: inline-block; width: 15px; height: 15px; margin-right: .5rem;
    vertical-align: -2px; border-radius: 50%;
    border: 2px solid var(--homey-line-color);
    border-top-color: var(--homey-color-blue, #1B6AC9);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .sweep-bar { height: 3px; border-radius: 2px; background: var(--homey-line-color); margin: .75rem 0 1rem; overflow: hidden; }
  .sweep-bar > span {
    display: block; height: 100%; width: 40%; border-radius: 2px;
    background: var(--homey-color-blue, #1B6AC9);
    animation: slide 1.4s ease-in-out infinite;
  }
  @keyframes slide {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(250%); }
  }
</style>

<h1 data-i18n="pair.title"></h1>
<p class="intro" data-i18n="pair.intro"></p>

<button type="button" id="search" disabled></button>
<div id="progress" class="sweep-bar hidden"><span></span></div>
<div id="status" class="status"></div>
<div id="list"></div>

<details class="manual">
  <summary data-i18n="pair.manual"></summary>
  <div class="fields">
    <input type="text" id="host" inputmode="decimal" autocomplete="off" placeholder="192.168.1.50">
    <input type="text" id="community" autocomplete="off" value="public" style="max-width:9rem">
    <button type="button" id="add" data-i18n="pair.add"></button>
  </div>
</details>

<script type="text/javascript">
  /*
   * Two things this view must not do, both learned the hard way.
   *
   * It must not load /homey.js itself. Homey injects its own API into a pairing
   * view, and including the script again produced a second instance that was not
   * attached to the session: the script ran, the button relabelled itself, and
   * every emit vanished — the driver logged "onPair start" and never heard from
   * the view again.
   *
   * It must not call Homey.ready() or Homey.setTitle() either. The pairing view
   * that does work in these apps calls neither, and uses Homey.emit() directly.
   *
   * The reporting stays: it is what turned a blank screen into a located fault.
   */
  function report(message) {
    try { Homey.emit('viewLog', String(message)); } catch (e) { /* nothing we can do */ }
  }

  report('view script running');

  window.addEventListener('error', (event) =>
    report('window error: ' + event.message + ' @' + event.lineno));
  window.addEventListener('unhandledrejection', (event) =>
    report('unhandled rejection: ' + ((event.reason && event.reason.message) || event.reason)));

  /** Translates, falling back to the key so a missing string never throws. */
  function t(key, fallback) {
    try {
      const value = Homey.__(key);
      if (value && value !== key) return value;
    } catch (e) {
      report('translate failed for ' + key + ': ' + e.message);
    }
    return fallback;
  }

  const searchEl = document.getElementById('search');
  const statusEl = document.getElementById('status');
  const listEl = document.getElementById('list');
  const hostEl = document.getElementById('host');
  const communityEl = document.getElementById('community');
  const addEl = document.getElementById('add');

  let busy = false;
  let sweeping = false;

  const progressEl = document.getElementById('progress');

  function setStatus(text, bad) {
    statusEl.textContent = text || '';
    statusEl.className = bad ? 'status bad' : 'status';
  }

  /** Shows the moving bar and a spinning marker while the sweep is under way. */
  function setSearching(on, text) {
    progressEl.className = on ? 'sweep-bar' : 'sweep-bar hidden';
    if (on) {
      statusEl.className = 'status';
      statusEl.innerHTML = '<span class="spinner"></span>' + escapeHtml(text || '');
    }
  }

  function escapeHtml(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    })[c]);
  }

  function render(printers) {
    listEl.innerHTML = '';
    for (const printer of printers) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'row';
      const meta = [printer.host, printer.serial].filter(Boolean).join(' \u00b7 ');
      button.innerHTML =
        '<div class="grow">' +
          '<div class="name">' + escapeHtml(printer.name) + '</div>' +
          '<div class="meta">' + escapeHtml(meta) + '</div>' +
        '</div>';
      button.addEventListener('click', () => adopt(printer));
      listEl.appendChild(button);
    }
  }

  /**
   * Asks the printer which protocol it should be read with, before it is created.
   *
   * The sweep speaks v2c to 254 addresses at once and records what answered, and
   * that is all it can afford to do: asking each address to walk a table as well
   * would turn a search into a minute of waiting. But answering a v2c question
   * is not the same as being readable over v2c — a printer can reply to a plain
   * GET and then time out on every table walk, which is the shape two owners in
   * the support topic hit. One had to correct the version by hand twice; the
   * other saw a paired printer with named rows and no levels in any of them.
   *
   * Here there is exactly one address and the user is waiting on it, so the full
   * probe is affordable and it is the one that decides. The swept answer is kept
   * as the fallback: a printer that has gone quiet between the search and the
   * tap should still pair with what the search saw, rather than not at all.
   */
  async function confirmProtocol(printer) {
    // The manual path already probed this exact address to get here, so asking
    // again would spend a second proving what the previous answer established.
    if (printer.confirmed) return printer.version || 'v2c';

    try {
      const answer = await Homey.emit('probe', {
        host: printer.host,
        community: printer.community || 'public',
      });
      if (answer && answer.ok && answer.printer && answer.printer.version) {
        return answer.printer.version;
      }
    } catch (error) {
      report('protocol check failed: ' + ((error && error.message) || error));
    }
    return printer.version || 'v2c';
  }

  async function adopt(printer) {
    if (busy) return;
    busy = true;
    report('adopting ' + printer.host);

    try {
      setStatus(t('pair.checking', 'Checking how to read this printer\u2026'));
      const version = await confirmProtocol(printer);
      report('adopting ' + printer.host + ' over ' + version);

      await Homey.createDevice({
        name: printer.name,
        data: { id: printer.serial || ('host:' + printer.host) },
        settings: {
          host: printer.host,
          community: printer.community || 'public',
          version: version,
          poll_interval: 300,
          low_threshold: 15,
        },
      });
      report('created ' + printer.host);
      Homey.done();
    } catch (error) {
      report('createDevice failed: ' + ((error && error.message) || error));
      setStatus((error && error.message) || String(error), true);
      busy = false;
    }
  }

  async function sweep() {
    if (sweeping) return;
    sweeping = true;
    // The search starts on its own, so the button reports what is happening
    // rather than inviting a click on something already under way.
    searchEl.disabled = true;
    searchEl.textContent = t('pair.searching_button', 'Searching\u2026');
    listEl.innerHTML = '';
    setSearching(true, t('pair.searching', 'Searching\u2026'));
    report('sweep: requesting scan_start');

    try {
      const started = await Homey.emit('scan_start', null);
      report('sweep: scan_start returned ' + JSON.stringify(started));

      if (!started || !started.started) {
        setSearching(false);
        setStatus(t('pair.none_found', 'No printer found.'));
        return;
      }

      for (let i = 0; i < 30; i += 1) {
        await new Promise((resolve) => setTimeout(resolve, 1500));
        const data = await Homey.emit('scan_status', null);
        if (!data) { report('sweep: scan_status returned nothing'); break; }

        render(data.printers || []);
        if (!data.running) {
          report('sweep: finished with ' + (data.printers || []).length);
          setSearching(false);
          setStatus((data.printers || []).length ? '' : t('pair.none_found', 'No printer found.'));
          return;
        }
      }
      report('sweep: gave up waiting');
    } catch (error) {
      report('sweep failed: ' + ((error && error.message) || error));
      setSearching(false);
      setStatus((error && error.message) || String(error), true);
    } finally {
      setSearching(false);
      sweeping = false;
      searchEl.disabled = false;
      searchEl.textContent = t('pair.search_again', 'Search again');
    }
  }

  async function addManually() {
    const host = hostEl.value.trim();
    if (!host) return;

    addEl.disabled = true;
    setStatus(t('pair.testing', 'Contacting\u2026'));
    try {
      const answer = await Homey.emit('probe', { host, community: communityEl.value.trim() });
      if (!answer || !answer.ok) {
        setStatus((answer && answer.message) || 'Error', true);
        return;
      }
      setStatus('');
      answer.printer.confirmed = true;
      await adopt(answer.printer);
    } catch (error) {
      report('probe failed: ' + ((error && error.message) || error));
      setStatus((error && error.message) || String(error), true);
    } finally {
      addEl.disabled = false;
    }
  }

  searchEl.addEventListener('click', sweep);
  addEl.addEventListener('click', addManually);
  hostEl.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') addManually();
  });

  // Labels are set from script rather than data-i18n, so a translation problem
  // cannot leave a button that looks empty and unclickable.
  searchEl.textContent = t('pair.searching_button', 'Searching\u2026');
  addEl.textContent = t('pair.add', 'Add');

  report('view ready, starting sweep');
  sweep();
</script>
