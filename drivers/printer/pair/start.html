<script type="text/javascript" src="/homey.js" data-origin="pair"></script>

<style>
  .intro { color: var(--homey-text-color-light); margin-bottom: 1rem; line-height: 1.45; }
  .row {
    display: flex; align-items: center; gap: .75rem;
    width: 100%; box-sizing: border-box; text-align: left;
    padding: .75rem .85rem; margin-bottom: .5rem;
    border: 1px solid var(--homey-line-color); border-radius: 8px;
    background: var(--homey-background-color); color: var(--homey-text-color);
    font: inherit; cursor: pointer;
  }
  .row:hover { border-color: var(--homey-color-blue, #1B6AC9); }
  .row:disabled { opacity: .55; cursor: default; }
  .row .name { font-weight: 600; }
  .row .meta { color: var(--homey-text-color-light); font-size: .85rem; }
  .row .grow { flex: 1; min-width: 0; }
  .row .name, .row .meta { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status { margin: 1rem 0; color: var(--homey-text-color-light); line-height: 1.45; }
  .status.bad { color: var(--homey-color-red, #da3633); }
  .manual { margin-top: 1.5rem; border-top: 1px solid var(--homey-line-color); padding-top: 1rem; }
  .manual summary { cursor: pointer; color: var(--homey-text-color-light); }
  .manual .fields { display: flex; gap: .5rem; margin-top: .75rem; }
  .manual input {
    flex: 1; min-width: 0; padding: .55rem .65rem; font-size: 1rem;
    border: 1px solid var(--homey-line-color); border-radius: 6px;
    background: var(--homey-background-color); color: var(--homey-text-color);
  }
  button {
    padding: .55rem 1rem; border-radius: 6px; border: 0; cursor: pointer;
    background: var(--homey-color-blue, #1B6AC9); color: #fff; font: inherit;
  }
  button:disabled { opacity: .55; cursor: default; }
  #search { width: 100%; padding: .7rem 1rem; font-weight: 600; }
  .hidden { display: none; }
</style>

<h1 data-i18n="pair.title"></h1>
<p class="intro" data-i18n="pair.intro"></p>

<button type="button" id="search" data-i18n="pair.search"></button>
<div id="status" class="status"></div>
<div id="list"></div>

<details class="manual">
  <summary data-i18n="pair.manual"></summary>
  <div class="fields">
    <input type="text" id="host" inputmode="decimal" autocomplete="off" placeholder="192.168.1.50">
    <input type="text" id="community" autocomplete="off" value="public" style="max-width:9rem">
    <button type="button" id="add" data-i18n="pair.add"></button>
  </div>
</details>

<script type="text/javascript">
  /*
   * Defensive on purpose. The previous version of this view died before it ran a
   * single line of useful code: the driver's trace showed "onPair start" and
   * nothing after it, not even the log this view emits on startup. Anything that
   * throws up here takes the whole view with it and leaves an inert screen with
   * no clue why.
   *
   * So: Homey.ready() goes first, before any other Homey call; the very next
   * statement reports that the script is alive; and every optional API is
   * wrapped, because a call that does not exist in the pairing frontend would
   * otherwise be indistinguishable from a broken sweep.
   */
  Homey.ready();

  function report(message) {
    try { Homey.emit('viewLog', String(message)); } catch (e) { /* nothing we can do */ }
  }

  report('view script running');

  window.addEventListener('error', (event) =>
    report('window error: ' + event.message + ' @' + event.lineno));
  window.addEventListener('unhandledrejection', (event) =>
    report('unhandled rejection: ' + ((event.reason && event.reason.message) || event.reason)));

  /** Translates, falling back to the key so a missing string never throws. */
  function t(key, fallback) {
    try {
      const value = Homey.__(key);
      if (value && value !== key) return value;
    } catch (e) {
      report('translate failed for ' + key + ': ' + e.message);
    }
    return fallback;
  }

  const searchEl = document.getElementById('search');
  const statusEl = document.getElementById('status');
  const listEl = document.getElementById('list');
  const hostEl = document.getElementById('host');
  const communityEl = document.getElementById('community');
  const addEl = document.getElementById('add');

  let busy = false;
  let sweeping = false;

  function setStatus(text, bad) {
    statusEl.textContent = text || '';
    statusEl.className = bad ? 'status bad' : 'status';
  }

  function escapeHtml(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    })[c]);
  }

  function render(printers) {
    listEl.innerHTML = '';
    for (const printer of printers) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'row';
      const meta = [printer.host, printer.serial].filter(Boolean).join(' \u00b7 ');
      button.innerHTML =
        '<div class="grow">' +
          '<div class="name">' + escapeHtml(printer.name) + '</div>' +
          '<div class="meta">' + escapeHtml(meta) + '</div>' +
        '</div>';
      button.addEventListener('click', () => adopt(printer));
      listEl.appendChild(button);
    }
  }

  async function adopt(printer) {
    if (busy) return;
    busy = true;
    report('adopting ' + printer.host);

    try {
      await Homey.createDevice({
        name: printer.name,
        data: { id: printer.serial || ('host:' + printer.host) },
        settings: {
          host: printer.host,
          community: printer.community || 'public',
          version: printer.version || 'v2c',
          poll_interval: 300,
          low_threshold: 15,
        },
      });
      report('created ' + printer.host);
      Homey.done();
    } catch (error) {
      report('createDevice failed: ' + ((error && error.message) || error));
      setStatus((error && error.message) || String(error), true);
      busy = false;
    }
  }

  async function sweep() {
    if (sweeping) return;
    sweeping = true;
    searchEl.disabled = true;
    listEl.innerHTML = '';
    setStatus(t('pair.searching', 'Searching\u2026'));
    report('sweep: requesting scan_start');

    try {
      const started = await Homey.emit('scan_start', null);
      report('sweep: scan_start returned ' + JSON.stringify(started));

      if (!started || !started.started) {
        setStatus(t('pair.none_found', 'No printer found.'));
        return;
      }

      for (let i = 0; i < 30; i += 1) {
        await new Promise((resolve) => setTimeout(resolve, 1500));
        const data = await Homey.emit('scan_status', null);
        if (!data) { report('sweep: scan_status returned nothing'); break; }

        render(data.printers || []);
        if (!data.running) {
          report('sweep: finished with ' + (data.printers || []).length);
          setStatus((data.printers || []).length ? '' : t('pair.none_found', 'No printer found.'));
          return;
        }
      }
      report('sweep: gave up waiting');
    } catch (error) {
      report('sweep failed: ' + ((error && error.message) || error));
      setStatus((error && error.message) || String(error), true);
    } finally {
      sweeping = false;
      searchEl.disabled = false;
      searchEl.textContent = t('pair.search_again', 'Search again');
    }
  }

  async function addManually() {
    const host = hostEl.value.trim();
    if (!host) return;

    addEl.disabled = true;
    setStatus(t('pair.testing', 'Contacting\u2026'));
    try {
      const answer = await Homey.emit('probe', { host, community: communityEl.value.trim() });
      if (!answer || !answer.ok) {
        setStatus((answer && answer.message) || 'Error', true);
        return;
      }
      setStatus('');
      await adopt(answer.printer);
    } catch (error) {
      report('probe failed: ' + ((error && error.message) || error));
      setStatus((error && error.message) || String(error), true);
    } finally {
      addEl.disabled = false;
    }
  }

  searchEl.addEventListener('click', sweep);
  addEl.addEventListener('click', addManually);
  hostEl.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') addManually();
  });

  // Labels are set from script rather than data-i18n, so a translation problem
  // cannot leave a button that looks empty and unclickable.
  searchEl.textContent = t('pair.search', 'Search my network');
  addEl.textContent = t('pair.add', 'Add');

  // setTitle is optional: if the pairing frontend does not provide it, losing the
  // title is acceptable, losing the whole view is not.
  try { Homey.setTitle(t('pair.title', 'Find your printer')); }
  catch (e) { report('setTitle unavailable: ' + e.message); }

  report('view ready, starting sweep');
  sweep();
</script>
