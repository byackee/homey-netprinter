<script type="text/javascript" src="/homey.js" data-origin="settings"></script>

<style>
  body { line-height: 1.5; }
  h2 { margin: 1.5rem 0 .5rem; font-size: 1.05rem; }
  h2:first-child { margin-top: 0; }
  p.hint { color: var(--homey-text-color-light); margin: 0 0 1rem; }
  .card {
    border: 1px solid var(--homey-line-color); border-radius: 8px;
    padding: .85rem .95rem; margin-bottom: .75rem;
  }
  .card .title { font-weight: 600; }
  .card .sub { color: var(--homey-text-color-light); font-size: .88rem; }
  .bad { color: var(--homey-color-red, #da3633); }
  /* The device's own bookkeeping, below the printer's answer: useful when
     something is wrong, never the thing you read first. */
  .faint { color: var(--homey-text-color-light); font-size: .78rem; margin-top: .35rem;
           word-break: break-word; opacity: .75; }
  .ok { color: var(--homey-color-green, #2ea043); }
  table { width: 100%; border-collapse: collapse; margin-top: .6rem; font-size: .92rem; }
  td { padding: .22rem 0; }
  td.level { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bar { height: 5px; border-radius: 3px; background: var(--homey-line-color); margin-top: .2rem; }
  .bar > span { display: block; height: 100%; border-radius: 3px; background: var(--homey-color-blue, #1B6AC9); }
  .row { display: flex; gap: .5rem; margin-bottom: .75rem; }
  .row input {
    flex: 1; min-width: 0; padding: .55rem .65rem; font-size: 1rem;
    border: 1px solid var(--homey-line-color); border-radius: 6px;
    background: var(--homey-background-color); color: var(--homey-text-color);
  }
  button {
    padding: .55rem 1rem; border-radius: 6px; border: 0; cursor: pointer;
    background: var(--homey-color-blue, #1B6AC9); color: #fff; font: inherit;
  }
  button:disabled { opacity: .55; cursor: default; }
  pre {
    white-space: pre-wrap; word-break: break-word; margin: .5rem 0 0;
    font-size: .85rem; color: var(--homey-text-color-light);
  }
  /* The report is meant to be selected and pasted, so it is monospaced, scrolls
     rather than reflowing, and is capped so it cannot push the rest of the page
     off screen. */
  pre.report {
    white-space: pre; overflow-x: auto; max-height: 22rem; overflow-y: auto;
    color: var(--homey-text-color); font-family: ui-monospace, Menlo, Consolas, monospace;
    background: var(--homey-background-color); border: 1px solid var(--homey-line-color);
    border-radius: 6px; padding: .6rem .7rem; user-select: text;
  }
</style>

<h2 data-i18n="settings.printers"></h2>
<p class="hint" data-i18n="settings.printers_hint"></p>
<div id="devices"></div>

<h2 data-i18n="settings.test"></h2>
<p class="hint" data-i18n="settings.test_hint"></p>
<div class="row">
  <input type="text" id="host" inputmode="decimal" autocomplete="off" placeholder="192.168.1.50">
  <input type="text" id="community" autocomplete="off" value="public" style="max-width:9rem">
  <button type="button" id="test" data-i18n="settings.test_button"></button>
</div>
<div id="test-result"></div>

<h2 data-i18n="settings.sweep"></h2>
<p class="hint" data-i18n="settings.sweep_hint"></p>
<button type="button" id="sweep" data-i18n="settings.sweep_button"></button>
<div id="sweep-result"></div>

<h2 data-i18n="settings.dump"></h2>
<p class="hint" data-i18n="settings.dump_hint"></p>
<button type="button" id="dump" data-i18n="settings.dump_button"></button>
<div id="dump-result"></div>

<script type="text/javascript">
  /*
   * Everything lives inside onHomeyReady because `Homey` is not a global on a
   * settings page: it is handed to this function. Code outside it that touches
   * Homey throws a ReferenceError, which is invisible here — a CLI-installed app
   * has no readable log, which is the very problem this page exists to solve.
   */
  function onHomeyReady(Homey) {
    Homey.ready();

    function esc(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      })[c]);
    }

    function call(method, path, body) {
      return new Promise((resolve, reject) => {
        Homey.api(method, path, body || null, (err, result) => {
          if (err) reject(err instanceof Error ? err : new Error(String(err)));
          else resolve(result);
        });
      });
    }

    /**
     * A level of null means the printer declined to say — shown as such, never as 0.
     *
     * "Declined" comes in two flavours the MIB distinguishes and this page used
     * to flatten into one: -3 is "there is some left, I will not count it", -2
     * is "I have no idea". A Ricoh that reports -3 on every cartridge showed as
     * unknown, which reads like a fault on a printer that is telling us
     * something perfectly useful.
     */
    function levelCell(percent, someRemaining) {
      if (percent === null || percent === undefined) {
        const label = someRemaining ? 'settings.some_left' : 'settings.unknown';
        return '<td class="level sub">' + esc(Homey.__(label)) + '</td>';
      }
      return '<td class="level">' + percent + ' %</td>';
    }

    function suppliesTable(supplies) {
      if (!supplies || !supplies.length) return '';
      let html = '<table>';
      for (const supply of supplies) {
        // Coerced, not trusted. Every other value on this page goes through
        // esc() because it came from a printer; this one is built into a style
        // attribute instead, where escaping would not help. It is provably a
        // number today — supplyPercent() clamps it — and this keeps it one if
        // that ever stops being true.
        const width = Math.max(0, Math.min(100, Number(supply.percent) || 0));
        html +=
          '<tr><td>' + esc(supply.description || supply.colour) +
          rawLevel(supply) +
          '<div class="bar"><span style="width:' + width + '%"></span></div></td>' +
          levelCell(supply.percent, supply.someRemaining) + '</tr>';
      }
      return html + '</table>';
    }

    /**
     * The level and capacity exactly as the printer sent them.
     *
     * This is the line that answers "why is the alarm on when every level reads
     * fine": a percentage is only ever as good as the two numbers behind it, and
     * those numbers are otherwise invisible to anyone reporting a problem.
     */
    function rawLevel(supply) {
      if (supply.level === undefined) return '';
      const unit = supply.unit && supply.unit !== 'unknown' ? ' ' + supply.unit : '';
      // The class is shown but no longer interpreted: RFC 3805 has both classes
      // count down towards zero, a receptacle reporting the space it has left.
      // It stays on screen because it is what a user has to paste when a level
      // looks wrong, and it is invisible everywhere else.
      const cls = supply.supplyClass === null || supply.supplyClass === undefined
        ? '' : ' · class ' + supply.supplyClass;
      // A level of -3 next to a percentage looks like a contradiction unless the
      // page says where the percentage came from. It came from the manufacturer's
      // own branch, which is a weaker source than the standard table, and a user
      // reading a number is entitled to know that before trusting it.
      // An IPP number is a standard reading of a standard attribute taken over
      // another protocol, which is a different claim from a manufacturer's
      // private guess — so it is labelled differently rather than lumped in.
      const source = supply.vendorSourced ? ' · manufacturer value'
        : supply.ippSourced ? ' · read over IPP' : '';
      return '<div class="sub">' +
        esc(supply.level + ' / ' + supply.maxCapacity + unit + cls + source) + '</div>';
    }

    function traysTable(trays) {
      if (!trays || !trays.length) return '';
      let html = '<table>';
      for (const tray of trays) {
        const label = [tray.name, tray.media].filter(Boolean).join(' · ');
        html += '<tr><td>' + esc(label || Homey.__('settings.tray')) + '</td>' +
          levelCell(tray.percent, tray.someRemaining) + '</tr>';
      }
      return html + '</table>';
    }

    async function loadDevices() {
      const target = document.getElementById('devices');
      target.innerHTML = '<p class="hint">' + esc(Homey.__('settings.loading')) + '</p>';

      try {
        const data = await call('GET', '/diagnostics');
        if (!data.devices.length) {
          target.innerHTML = '<p class="hint">' + esc(Homey.__('settings.no_devices')) + '</p>';
          return;
        }

        target.innerHTML = data.devices.map((device) => {
          const head =
            '<div class="title">' + esc(device.name) + '</div>' +
            '<div class="sub">' + esc(device.host) + ' · SNMP ' + esc(device.version) + '</div>';

          if (device.error) {
            return '<div class="card">' + head +
              '<div class="bad">' + esc(device.error) + '</div></div>';
          }

          const r = device.reading;
          const bits = [r.status];
          // Always shown, blank included. Hiding it when the printer says nothing
          // makes "no message" and "not reported here" look identical, which is
          // the one distinction someone debugging a stuck message needs.
          bits.push(r.display ? '"' + r.display + '"' : Homey.__('settings.no_message'));
          if (r.pages !== null) bits.push(r.pages + ' ' + Homey.__('settings.pages'));
          if (r.outputTray && r.outputTray !== 'unknown') {
            bits.push(Homey.__('settings.output_tray') + ': ' + Homey.__('settings.tray_' + r.outputTray));
          }
          const openCovers = (r.covers || []).filter((c) => c.open).map((c) => c.description);

          // The printer's live answer against what the device is holding. They
          // should be identical; when they are not, the app has failed to write
          // a value and that is worth shouting about rather than hiding.
          const poll = r.lastPoll;
          const capabilityErrors = (poll && poll.capabilityErrors) || [];
          const pollLine = poll
            ? Homey.__('settings.last_poll') + ': ' + new Date(poll.at).toLocaleString() + ' · ' + poll.outcome
            : Homey.__('settings.never_polled');

          const stored = r.stored || {};
          const drift = [];
          if (stored.message !== undefined && stored.message !== r.display) {
            drift.push(Homey.__('settings.stored_message') + ': ' + (stored.message || '—'));
          }
          if (stored.status !== undefined && stored.status !== null && stored.status !== r.status) {
            drift.push(Homey.__('settings.stored_status') + ': ' + stored.status);
          }

          return '<div class="card">' + head +
            '<div class="sub">' + esc(bits.join(' · ')) + '</div>' +
            // The printer's own words come first: on a machine whose alarm has no
            // visible cause, this is the line that names it.
            ((r.alerts || []).length
              ? '<div class="bad">' + esc(r.alerts.join(' · ')) + '</div>' : '') +
            (r.errors.length ? '<div class="bad">' + esc(r.errors.join(', ')) + '</div>' : '') +
            (openCovers.length ? '<div class="bad">' + esc(openCovers.join(', ')) + '</div>' : '') +
            (drift.length ? '<div class="bad">' + esc(drift.join(' · ')) + '</div>' : '') +
            // A capability write that failed is caught so one bad row cannot
            // abort a poll. Caught and logged is invisible here, though, and a
            // migration failing every add looks exactly like one that never
            // ran — which cost a real afternoon to work out.
            (capabilityErrors.length
              ? '<div class="bad">' + esc(capabilityErrors.join(' · ')) + '</div>' : '') +
            suppliesTable(r.supplies) +
            traysTable(r.trays) +
            // The rows the device actually carries, and when it last read the
            // printer itself. Everything above this line is the printer's live
            // answer, which says nothing about whether the device kept up.
            '<div class="faint">' + esc(pollLine) + '</div>' +
            '<div class="faint">' + esc((r.capabilities || []).join(' ')) + '</div>' +
            '</div>';
        }).join('');
      } catch (error) {
        target.innerHTML = '<p class="bad">' + esc(error.message) + '</p>';
      }
    }

    async function runTest() {
      const button = document.getElementById('test');
      const target = document.getElementById('test-result');
      button.disabled = true;
      target.innerHTML = '<p class="hint">' + esc(Homey.__('settings.testing')) + '</p>';

      try {
        const answer = await call('POST', '/test', {
          host: document.getElementById('host').value.trim(),
          community: document.getElementById('community').value.trim(),
        });

        if (!answer.ok) {
          target.innerHTML = '<div class="card bad">' + esc(answer.message) + '</div>';
          return;
        }

        const name = [answer.vendor, answer.model].filter(Boolean).join(' ');
        target.innerHTML = '<div class="card">' +
          '<div class="title ok">' + esc(name) + '</div>' +
          '<div class="sub">SNMP ' + esc(answer.version) +
          (answer.serial ? ' · ' + esc(answer.serial) : '') + '</div>' +
          suppliesTable(answer.supplies) + '</div>';
      } catch (error) {
        target.innerHTML = '<p class="bad">' + esc(error.message) + '</p>';
      } finally {
        button.disabled = false;
      }
    }

    function renderSweep(data) {
      const target = document.getElementById('sweep-result');

      if (data.error) {
        target.innerHTML = '<p class="bad">' + esc(data.error) + '</p>';
        return;
      }
      if (!data.subnet) {
        target.innerHTML = '<p class="bad">' + esc(Homey.__('settings.no_subnet')) + '</p>';
        return;
      }

      const cards = data.found.map((printer) =>
        '<div class="card">' +
        '<div class="title">' + esc([printer.vendor, printer.model].filter(Boolean).join(' ')) + '</div>' +
        '<div class="sub">' + esc(printer.host) +
        (printer.serial ? ' · ' + esc(printer.serial) : '') + '</div></div>').join('');

      if (data.running) {
        // Partial results are shown as they arrive rather than a blank wait.
        target.innerHTML = cards +
          '<p class="hint">' + esc(Homey.__('settings.sweeping')) + '</p>';
        return;
      }
      target.innerHTML = cards || ('<p class="hint">' + esc(Homey.__('settings.sweep_empty')) +
        ' (' + esc(data.subnet) + '.0/24)</p>');
    }

    /*
     * The sweep is started and then polled. Awaiting it in one call is what made
     * this page fail: a Homey API call is cut off after ten seconds and a /24
     * takes around sixteen.
     */
    async function runSweep() {
      const button = document.getElementById('sweep');
      button.disabled = true;
      document.getElementById('sweep-result').innerHTML =
        '<p class="hint">' + esc(Homey.__('settings.sweeping')) + '</p>';

      try {
        renderSweep(await call('POST', '/scan/start'));

        for (;;) {
          await new Promise((resolve) => setTimeout(resolve, 1500));
          const data = await call('GET', '/scan/status');
          renderSweep(data);
          if (!data.running) break;
        }
      } catch (error) {
        document.getElementById('sweep-result').innerHTML =
          '<p class="bad">' + esc(error.message) + '</p>';
      } finally {
        button.disabled = false;
      }
    }

    /*
     * Produces the report a support topic actually needs, from Homey rather than
     * from the user's own machine.
     *
     * The alternative this replaces was asking someone to install a command-line
     * SNMP tool, get its platform-specific argument syntax right, and photograph
     * the result. That is a lot to ask of anyone, and what came back was pages of
     * index rows rather than the six values that mattered — which was the fault
     * of the request, not of the person answering it.
     */
    async function runDump() {
      const button = document.getElementById('dump');
      const target = document.getElementById('dump-result');
      button.disabled = true;
      target.innerHTML = '<p class="hint">' + esc(Homey.__('settings.dumping')) + '</p>';

      try {
        const answer = await call('POST', '/dump', {
          host: document.getElementById('host').value.trim(),
          community: document.getElementById('community').value.trim(),
        });

        if (!answer.ok) {
          target.innerHTML = '<div class="card bad">' + esc(answer.message) + '</div>';
          return;
        }

        target.innerHTML = '<pre class="report" id="dump-text">' + esc(answer.text) + '</pre>' +
          '<button type="button" id="dump-copy" style="margin-top:.5rem">' +
          esc(Homey.__('settings.dump_copy')) + '</button>';

        document.getElementById('dump-copy').addEventListener('click', async (event) => {
          // Selecting a scrolling block by hand on a phone is close to
          // impossible, and this report exists to be pasted somewhere else.
          // execCommand is the fallback because a settings page is not always a
          // secure context, where navigator.clipboard simply is not there.
          try {
            await navigator.clipboard.writeText(answer.text);
          } catch (error) {
            const range = document.createRange();
            range.selectNodeContents(document.getElementById('dump-text'));
            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
            document.execCommand('copy');
          }
          event.target.textContent = Homey.__('settings.dump_copied');
        });
      } catch (error) {
        target.innerHTML = '<p class="bad">' + esc(error.message) + '</p>';
      } finally {
        button.disabled = false;
      }
    }

    document.getElementById('test').addEventListener('click', runTest);
    document.getElementById('sweep').addEventListener('click', runSweep);
    document.getElementById('dump').addEventListener('click', runDump);

    loadDevices();
  }
</script>
